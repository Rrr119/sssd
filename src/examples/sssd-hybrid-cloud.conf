# Example SSSD configuration for a hybrid cloud deployment where users
# come from two directories: an on-premise directory and a cloud
# directory.
#
# Both domains are served by a single provider stack (the LDAP
# provider), but they are fully isolated from each other:
#
#   * Cache isolation: every domain keeps its own cache database
#     (/var/lib/sss/db/cache_<domain>.ldb). Entries, cached credentials
#     and the online/offline state never leak between the directories.
#
#   * Offline login: cache_credentials stores a salted password hash in
#     the domain cache so users can log in while their directory is
#     unreachable. krb5_store_password_if_offline additionally stores a
#     Kerberos password for deferred ticket acquisition when the
#     auth_provider is krb5. offline_credentials_expiration = 0 means
#     cached credentials never expire.
#
# Adjust the URIs, search bases, bind credentials and certificate paths
# to match your environment, then move the domains you need out of the
# comment blocks.

[sssd]
services = nss, pam
# List both directories. The order defines the lookup order.
; domains = onprem, cloud

[nss]

[pam]
# Cached credentials never expire (value is in days). Set to a positive
# value to force users to reauthenticate online after that many days.
; offline_credentials_expiration = 0

# First directory: on-premise LDAP with Kerberos authentication.
; [domain/onprem]
; id_provider = ldap
; auth_provider = krb5
; chpass_provider = krb5
;
; ldap_uri = ldap://ldap.onprem.example.com
; ldap_search_base = dc=onprem,dc=example,dc=com
; ldap_schema = rfc2307bis
; ldap_tls_reqcert = demand
;
; krb5_server = kdc.onprem.example.com
; krb5_realm = ONPREM.EXAMPLE.COM
;
# Recommended with multiple domains: users log in as user@onprem.
; use_fully_qualified_names = true
# Offline login for this domain only.
; cache_credentials = true
; krb5_store_password_if_offline = true

# Second directory: cloud LDAP over LDAPS with simple bind
# authentication.
; [domain/cloud]
; id_provider = ldap
; auth_provider = ldap
;
; ldap_uri = ldaps://ldap.cloud.example.com
; ldap_search_base = dc=cloud,dc=example,dc=com
; ldap_schema = rfc2307
; ldap_tls_reqcert = demand
; ldap_tls_cacert = /etc/pki/tls/certs/cloud-ca.crt
; ldap_default_bind_dn = cn=sssd,ou=service,dc=cloud,dc=example,dc=com
; ldap_default_authtok = ChangeMe
;
; use_fully_qualified_names = true
# Offline login for this domain only.
; cache_credentials = true
